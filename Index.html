
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBL 2 Project Hub</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: #1e3a8a;
  color: white;
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 15px;
}

header button {
  width: auto;
  margin: 0;
  background: transparent;
  font-size: 25px;
  padding: 5px 10px;
}

nav {
  display: none;
  background: #172554;
  padding: 10px;
}

nav button {
  background: transparent;
  text-align: left;
}

main {
  max-width: 600px;
  margin: auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
  box-shadow: 0 2px 8px #cbd5e1;
}

input, button {
  width: 100%;
  padding: 12px;
  margin: 7px 0;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  font-size: 16px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
}

.result {
  color: #166534;
  font-weight: bold;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.project { display: none; }
.project.active { display: block; }

canvas {
  width: 100%;
  max-height: 280px;
}
</style>
</head>

<body>

<header>
  <button onclick="menu()" aria-label="Open menu">☰</button>
  <h2>PBL 2 Project Hub</h2>
</header>

<nav id="menu">
  <button onclick="show('student')">Student Result</button>
  <button onclick="show('electric')">Electricity Bill</button>
  <button onclick="show('attendance')">Attendance</button>
  <button onclick="show('expense')">Expense Analyzer</button>
  <button onclick="show('loan')">Loan EMI Calculator</button>
</nav>

<main>

<section id="student" class="project active">
<div class="card">
<h2>Student Result Analysis</h2>
<input id="marks" type="number" placeholder="Total marks">
<input id="maxmarks" type="number" placeholder="Maximum marks">
<button onclick="result()">Calculate Result</button>
<p id="studentResult" class="result"></p>
</div>
</section>

<section id="electric" class="project">
<div class="card">
<h2>Electricity Bill Calculator</h2>
<input id="units" type="number" placeholder="Units consumed">
<input id="price" type="number" value="5" placeholder="Price per unit (Rs.)">
<button onclick="bill()">Calculate Bill</button>
<p id="billResult" class="result"></p>
</div>
</section>

<section id="attendance" class="project">
<div class="card">
<h2>Attendance Management</h2>
<input id="present" type="number" placeholder="Days present">
<input id="working" type="number" placeholder="Total working days">
<button onclick="attendance()">Calculate Attendance</button>
<p id="attendanceResult" class="result"></p>
</div>
</section>

<section id="expense" class="project">
<div class="card">
<h2>Expense Analyzer</h2>
<p>Enter expenses separated by commas.</p>
<input id="expenses" placeholder="Example: 100, 200, 300">
<button onclick="expense()">Analyze Expenses</button>
<p id="expenseResult" class="result"></p>
</div>
</section>

<section id="loan" class="project">
<div class="card">
<h2>Loan EMI Calculator</h2>
<input id="loanAmount" type="number" placeholder="Loan amount (Rs.)">
<input id="interestRate" type="number" placeholder="Annual interest rate (%)">
<input id="loanYears" type="number" placeholder="Loan period (years)">
<button onclick="emi()">Calculate EMI</button>
<p id="loanResult" class="result"></p>
<canvas id="chart" width="500" height="280"></canvas>
</div>
</section>

</main>

<script>
function menu() {
  let nav = document.getElementById("menu");
  nav.style.display = nav.style.display === "block" ? "none" : "block";
}

function show(id) {
  document.querySelectorAll(".project").forEach(
    p => p.classList.remove("active")
  );
  document.getElementById(id).classList.add("active");
  document.getElementById("menu").style.display = "none";
}

function result() {
  let m = Number(document.getElementById("marks").value);
  let max = Number(document.getElementById("maxmarks").value);

  if (max <= 0 || m < 0 || m > max) {
    document.getElementById("studentResult").innerHTML =
      "Please enter valid marks.";
    return;
  }

  let p = m / max * 100;
  let grade = p >= 90 ? "A+" : p >= 80 ? "A" :
              p >= 70 ? "B" : p >= 60 ? "C" :
              p >= 40 ? "D" : "F";

  document.getElementById("studentResult").innerHTML =
    "Percentage: " + p.toFixed(2) + "%<br>" +
    "Grade: " + grade + "<br>" +
    "Result: " + (p >= 40 ? "PASS" : "FAIL");
}

function bill() {
  let u = Number(document.getElementById("units").value);
  let price = Number(document.getElementById("price").value);

  if (u < 0 || price < 0 ||
      document.getElementById("units").value === "" ||
      document.getElementById("price").value === "") {
    document.getElementById("billResult").innerHTML =
      "Enter valid units and price.";
    return;
  }

  let amount = u * price;

  document.getElementById("billResult").innerHTML =
    "Units consumed: " + u + "<br>" +
    "Price per unit: Rs. " + price.toFixed(2) + "<br>" +
    "Total bill: Rs. " + amount.toFixed(2);
}

function attendance() {
  let p = Number(document.getElementById("present").value);
  let t = Number(document.getElementById("working").value);

  if (t <= 0 || p < 0 || p > t) {
    document.getElementById("attendanceResult").innerHTML =
      "Enter valid attendance details.";
    return;
  }

  let percent = p / t * 100;

  document.getElementById("attendanceResult").innerHTML =
    "Attendance: " + percent.toFixed(2) + "%<br>" +
    "Status: " + (percent >= 75 ? "Eligible" : "Shortage");
}

function expense() {
  let text = document.getElementById("expenses").value.trim();

  // Accept commas, spaces, or new lines between amounts.
  let values = text.split(/[,\s]+/).map(Number);

  if (!text || values.some(x => !Number.isFinite(x) || x < 0)) {
    document.getElementById("expenseResult").innerHTML =
      "Enter valid expenses, such as 100, 200, 300.";
    return;
  }

  let total = values.reduce((sum, x) => sum + x, 0);
  let highest = Math.max(...values);
  let average = total / values.length;

  document.getElementById("expenseResult").innerHTML =
    "Number of expenses: " + values.length + "<br>" +
    "Total expense: Rs. " + total.toFixed(2) + "<br>" +
    "Average expense: Rs. " + average.toFixed(2) + "<br>" +
    "Highest expense: Rs. " + highest.toFixed(2);
}

function emi() {
  let p = Number(document.getElementById("loanAmount").value);
  let rate = Number(document.getElementById("interestRate").value);
  let years = Number(document.getElementById("loanYears").value);

  if (p <= 0 || rate < 0 || years <= 0) {
    document.getElementById("loanResult").innerHTML =
      "Enter valid loan details.";
    return;
  }

  let n = years * 12;
  let r = rate / 1200;

  let monthly = r === 0 ? p / n :
    p * r * Math.pow(1 + r, n) /
    (Math.pow(1 + r, n) - 1);

  let total = monthly * n;
  let interest = total - p;

  document.getElementById("loanResult").innerHTML =
    "Monthly EMI: Rs. " + monthly.toFixed(2) + "<br>" +
    "Total principal: Rs. " + p.toFixed(2) + "<br>" +
    "Total interest: Rs. " + interest.toFixed(2) + "<br>" +
    "Total repayment: Rs. " + total.toFixed(2);

  drawChart(p, interest);
}

function drawChart(principal, interest) {
  let canvas = document.getElementById("chart");
  let ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let total = principal + interest;
  let x = 50, y = 60, width = 400, height = 55;

  let principalWidth = width * principal / total;
  let interestWidth = width * interest / total;

  ctx.fillStyle = "#2563eb";
  ctx.fillRect(x, y, principalWidth, height);

  ctx.fillStyle = "#f59e0b";
  ctx.fillRect(x + principalWidth, y, interestWidth, height);

  ctx.fillStyle = "#1e293b";
  ctx.font = "16px Arial";
  ctx.fillText("Principal vs Interest", x, 30);

  ctx.fillStyle = "#2563eb";
  ctx.fillRect(x, 150, 18, 18);
  ctx.fillStyle = "#1e293b";
  ctx.fillText("Principal: Rs. " + principal.toFixed(2), x + 28, 165);

  ctx.fillStyle = "#f59e0b";
  ctx.fillRect(x, 190, 18, 18);
  ctx.fillStyle = "#1e293b";
  ctx.fillText("Interest: Rs. " + interest.toFixed(2), x + 28, 205);

  ctx.fillText("Total repayment: Rs. " + total.toFixed(2), x, 245);
}
</script>

</body>
</html>
